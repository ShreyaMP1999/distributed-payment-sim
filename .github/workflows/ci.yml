name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paymentsim
          POSTGRES_USER: paymentsim
          POSTGRES_PASSWORD: paymentsim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paymentsim -d paymentsim"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify unit tests, integration tests, and executable JAR
        run: mvn -B clean verify
      - name: Start packaged application and smoke test HTTP
        shell: bash
        run: |
          java -jar target/payment-sim.jar > /tmp/payment-sim.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/payment-sim.log; exit 1; fi
          python3 scripts/smoke.py
      - name: Validate Compose and build runtime image
        run: |
          docker compose config --quiet
          docker build -t paymentsim:ci .
      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: payment-sim-jar
          path: target/payment-sim.jar
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
