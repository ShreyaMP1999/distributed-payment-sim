server:
  port: ${PORT:8080}

spring:
  application:
    name: payment-sim

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentsim}
    username: ${DB_USERNAME:paymentsim}
    password: ${DB_PASSWORD:paymentsim}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

